<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E3B34"><title>Namaz &amp; Dua Tracker</title>
<style>
:root{--ink:#0E3B34;--deep:#082923;--gold:#E8B54D;--mist:#EDF3F0;--card:#fff;--line:#D5E2DC;--txt:#17302B;--soft:#5B7770;--ok:#1E8A5B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,"Noto Sans Tamil","Noto Sans",sans-serif;background:var(--mist);color:var(--txt);line-height:1.45}
header{background:var(--ink);color:#fff;padding:14px 16px 14px;position:sticky;top:0;z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:18px;margin:0;font-weight:700}.sub{font-size:13px;opacity:.8}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px}
.days{display:flex;gap:6px;overflow-x:auto;margin:12px -4px 8px;padding:2px 4px}
.d{flex:0 0 auto;min-width:40px;text-align:center;padding:7px 0;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;border:0;font-size:14px}
.d.on{background:var(--gold);color:var(--deep);font-weight:700}.d.full::after{content:" ✓";font-size:11px}
.bar{height:8px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
main{padding:12px 14px 90px;max-width:720px;margin:auto}
.sec{margin:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec h2{font-size:17px;margin:0}.sec span{font-size:13px;color:var(--soft)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px}
.card.done{border-color:var(--ok);background:#F3FBF7}
.row{display:flex;gap:12px;align-items:flex-start}
.chk{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:17px;color:#fff;padding:0}
.done .chk{background:var(--ok);border-color:var(--ok)}
.ttl{font-weight:600;font-size:15px;overflow-wrap:anywhere}.meta{font-size:12.5px;color:var(--soft);margin-top:3px}
.pill{display:inline-block;background:var(--mist);border-radius:20px;padding:1px 9px;margin-right:5px}
.last{background:#FFF1CF;color:#7A5200}
details{margin-top:8px}summary{font-size:13px;color:var(--ink);font-weight:600}
.txt{margin-top:6px;padding:10px;background:var(--mist);border-radius:10px;font-size:14.5px}.txt b{display:block;font-size:12px;color:var(--soft);margin:6px 0 2px}.txt b:first-child{margin-top:0}
.ctr{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.ctr button{border:0;border-radius:10px;padding:10px 13px;background:var(--ink);color:#fff;font-size:15px;font-weight:600}
.ctr .s{background:var(--mist);color:var(--ink)}.ctr .n{font-weight:700;font-size:16px;min-width:76px;text-align:center}
.fin{opacity:.85}.fin .ttl{font-weight:500}
.ok{color:var(--ok);font-weight:600}
.banner{background:var(--ok);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:6px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(8,41,35,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.box{background:#fff;border-radius:20px;padding:24px 20px;max-width:380px;width:100%;text-align:center}
.box h3{margin:6px 0 8px;font-size:22px;color:var(--ink)}.box p{margin:8px 0;font-size:15.5px}
.big{font-size:54px}.box .pri{margin-top:12px;width:100%;border:0;border-radius:12px;background:var(--ink);color:#fff;padding:13px;font-size:16px;font-weight:600}
.box .alt{margin-top:8px;width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;font-size:15px}
.who button{display:block;width:100%;margin:8px 0;padding:14px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-size:17px;font-weight:600;color:var(--ink)}
input[type=date]{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin:6px 0}
.ach{background:#FFF8E5;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px;text-align:left}
</style></head><body>
<div id="app"></div>
<script>
const DATA=[{"id": "g", "name": "Daily Essentials", "ta": "தினசரி", "tasks": [{"title": "Believe in Allah that he will treat you and protect you", "en": "", "ta": "", "amount": "Throughout", "n": 1, "kind": "check", "days": null, "optional": true, "id": "g.1"}, {"title": "Say \"Astagfirullah\" whenever you are sad, are in fear, are have nothing to do throughout the day.", "en": "", "ta": "", "amount": "As Required", "n": 1, "kind": "check", "days": 28, "optional": false, "id": "g.2"}, {"title": "Give Sadaqa when and where feasible to poor", "en": "", "ta": "", "amount": "As Required", "n": 1, "kind": "check", "days": 28, "optional": false, "id": "g.3"}, {"title": "Bath in Water dissolving 11 Baer Leaves", "en": "", "ta": "", "amount": "1 Time", "n": 1, "kind": "check", "days": 7, "optional": false, "id": "g.4"}, {"title": "Wear TWS as required and advised", "en": "", "ta": "", "amount": "Throughout", "n": 1, "kind": "check", "days": 40, "optional": false, "id": "g.5"}]}, {"id": "6", "name": "Fajar Namaz", "tasks": [{"title": "Pray Fajar Namaz", "en": "", "ta": "", "amount": "2 Rakats", "n": 2, "kind": "rakat", "days": 28, "optional": false, "id": "6.1"}, {"title": "Pray Istaghfaar Namaz", "en": "", "ta": "", "amount": "2 Rakats", "n": 2, "kind": "rakat", "days": 28, "optional": false, "id": "6.2"}, {"title": "Say Tasbih - Astagfirullah", "en": "Astaghfirullah.", "ta": "அஸ்தஃபிருல்லாஹ்.", "amount": "313 Times", "n": 313, "kind": "count", "days": 28, "optional": false, "id": "6.3"}, {"title": "Read \"Ayat Ul Kursi\"", "en": "Allahu la ilaha illa huwa, al-hayyul-qayyum. La ta'khudhuhu sinatun wa la nawm. Lahu ma fis-samawati wa ma fil-ard. Man dhal-ladhi yashfa'u 'indahu illa bi-idhnih. Ya'lamu ma baina aidihim wa ma khalfahum. Wa la yuhituna bi-shai'im-min 'ilmihi illa bima sha'. Wasi'a kursiyyuhus-samawati wal-ard. Wa la ya'uduhu hifdhuhuma, wa huwal-'aliyyul-'azim.", "ta": "அல்லாஹு லா இலாஹ இல்லா ஹுவ, அல்-ஹய்யுல்-கய்யூம். லா தஅ்குதுஹு ஸினதுன் வலா நவ்ம். லஹூ மா ஃபிஸ்ஸமாவாத்தி வமா ஃபில்-அர்த். மன் தல்லதீ யஷ்ஃபஅு இந்தஹூ இல்லா பி-இத்னிஹி. யஅ்லமு மா பைன அய்தீஹிம் வமா கல்ஃபஹும். வலா யுஹீதூன பிஷைஇம் மின் இல்மிஹீ இல்லா பிமா ஷாஅ. வஸிஅ குர்ஸிய்யுஹுஸ்-ஸமாவாத்தி வல்-அர்த். வலா யஊதுஹூ ஹிஃப்ழுஹுமா, வஹுவல்-அலிய்யுல்-அழீம்.", "amount": "3 Times", "n": 3, "kind": "count", "days": 21, "optional": false, "id": "6.4"}, {"title": "Read \"Surah Falak\"", "en": "Qul a'udhu bi-rabbil-falaq. Min sharri ma khalaq. Wa min sharri ghasiqin idha waqab. Wa min sharrin-naffathati fil-'uqad. Wa min sharri hasidin idha hasad.", "ta": "குல் அஊது பி-ரப்பில்-ஃபலக். மின் ஷர்ரி மா கலக். வமின் ஷர்ரி காஸிகின் இதா வகப். வமின் ஷர்ரின்னஃப்ஃபாஸாதி ஃபில்-உகத். வமின் ஷர்ரி ஹாஸிதின் இதா ஹஸத்.", "amount": "3 Times", "n": 3, "kind": "count", "days": 21, "optional": false, "id": "6.5"}, {"title": "Read \"Surah Naas\"", "en": "Qul a'udhu bi-rabbin-naas. Malikin-naas. Ilahin-naas. Min sharril-waswasil-khannaas. Alladhi yuwaswisu fee sudurin-naas. Minal-jinnati wan-naas.", "ta": "குல் அஊது பி-ரப்பின்னாஸ். மலிகின்னாஸ். இலாஹின்னாஸ். மின் ஷர்ரில்-வஸ்வாஸில்-கன்னாஸ். அல்லதீ யுவஸ்விஸு ஃபீ ஸுதூரின்னாஸ். மினல்-ஜின்னத்தி வன்னாஸ்.", "amount": "3 Times", "n": 3, "kind": "count", "days": 21, "optional": false, "id": "6.6"}, {"title": "Read Dua No. 1", "en": "A‘ūdhu bi-wajhillāhil-‘aẓīmi alladhī laysa shay’un a‘ẓama minhu, wa bi-kalimātillāhit-tāmmāti allatī lā yujāwizuhunna barrun wa lā fājir, wa bi-asmā’illāhil-ḥusnā kullihā, mā ‘alimtu minhā wa mā lam a‘lam, min sharri mā khalaqa wa bara’a wa dhara’a.", "ta": "அஊது பிவஜ்ஹில்லாஹில் அழீமில் லதீ லைஸ ஷைஉன் அழ்அம மின்ஹு, வ பிகலிமாதில்லாஹித் தாம்மாத்தில்லதீ லா யுஜாவிஸுஹுன்ன பர்ருன் வலா ஃபாஜிர், வ பிஅஸ்மாஇல்லாஹில் ஹுஸ்னா குல்லிஹா, மா அலிம்து மின்ஹா வமா லம் அஃலம், மின் ஷர்ரி மா கலக வ பரஅ வ தரஅ.", "amount": "1 Time", "n": 1, "kind": "check", "days": 21, "optional": false, "id": "6.7"}, {"title": "Naksha Water - Disolve in Water the Previous Night & Drink 3 Times a Day (for 28 Days)", "en": "", "ta": "", "amount": "1 Time", "n": 1, "kind": "check", " ். அல்லதீ யுவஸ்விஸு ஃபீ ஸுதூரின்னாஸ். மினல்-ஜின்னத்தி வன்னாஸ்.", "amount": "1 Times", "n": 1, "kind": "check", "days": 21, "optional": false, "id": "7.4"}, {"title": "Read Dua No. 2", "en": "A‘ūdhu bi-wajhillāhil-karīmi, wa bi-kalimātillāhit-tāmmāti allatī lā yujāwizuhunna barrun wa lā fājir, min sharri mā yanzilu minas-samā’i, wa min sharri mā ya‘ruju fīhā, wa sharri mā dhara’a fil-arḍi, wa sharri mā yakhruju minhā, wa min fitanil-layli wan-nahār, wa min ṭawāriqil-layli wan-nahār, illā ṭāriqan yaṭruqu bikhayrin, yā Raḥmān.", "ta": "அஊது பிவஜ்ஹில்லாஹில் கரீம், வ பிகலிமாதில்லாஹித் தாம்மாத்தி அல்லதீ லா யுஜாவிஸுஹுன்ன பர்ருன் வலா ஃபாஜிர், மின் ஷர்ரி மா யன்ஸிலு மினஸ் ஸமாஇ, வ மின் ஷர்ரி மா யஅ்ருஜு ஃபீஹா, வ ஷர்ரி மா தறஅ ஃபில் அர்ளி, வ ஷர்ரி மா யக்ருஜு மின்ஹா, வ மின் ஃபிதனில் லைலி வன்னஹார், வ மின் தவாரிகில் லைலி வன்னஹார், இல்லா தாரிகன் யத்ருகு பிகைரின், யா ரஹ்மான்.", "amount": "1 Time", "n": 1, "kind": "check", "days": 21, "optional": false, "id": "7.5"}, {"title": "Naksha Water - Disolve in Water the Previous Night & Drink 3 Times a Day (for 28 Days)", "en": "", "ta": "", "amount": "1 Time", "n": 1, "kind": "check", "days": 28, "optional": false, "id": "7.6"}, {"title": "Dum Water - Mix in 20 Litres of Water and Drink for Drink Five Times a Day (for 40 Days)", "en": "", "ta": "", "amount": "1 Time", "n": 1, "kind": "check", "days": 40, "optional": false, "id": "7.7"}]}, {"id": "8", "name": "Asar Namaz", "tasks": [{"title": "Pray Asar Namaz", "en": "", "ta": "", "amount": "4 Rakats", "n": 4, "kind": "rakat", "days": 28, "optional": false, "id": "8.1"}, {"title": "Say Tasbih - La Hawla Wala Quwwata Illabillahi", "en": "La Hawla Wa La Quwwata Illa Billahi.", "ta": "லா ஹவ்ல வலா குவ்வத்த இல்லா பில்லாஹி.", "amount": "500 Times", "n": 500, "kind": "count", "days": 28, "optional": false, "id": "8.2"}, {"title": "Read \"Ayat Ul Kursi\"", "en": "Allahu la ilaha illa huwa, al-hayyul-qayyum. La ta'khudhuhu sinatun wa la nawm. Lahu ma fis-samawati wa ma fil-ard. Man dhal-ladhi yashfa'u let S=JSON.parse(localStorage.getItem(KEY)||"{}");S.start=S.start||{};S.prog=S.prog||{};S.cel=S.cel||{};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const $=h=>{const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ymd=d=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())};
function todayNo(){const[a,b,c]=S.start[S.user].split("-").map(Number);const st=new Date(a,b-1,c),n=new Date();return Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate())-st)/864e5)+1}
const active=(t,d)=>t.days===null||d<=t.days;
const P=()=>(S.prog[S.user]=S.prog[S.user]||{});
const got=(d,id)=>((P()[d]||{})[id])||0;
const isDone=(t,d)=>got(d,t.id)>=t.n;
const dayTasks=d=>ALL.filter(t=>active(t,d)&&!t.optional);
const dayFull=d=>d>=1&&dayTasks(d).length>0&&dayTasks(d).every(t=>isDone(t,d));
let view=1,modal=null;
function setCount(t,d,v){const p=P();p[d]=p[d]||{};p[d][t.id]=Math.max(0,Math.min(t.n,v));save();after(t,d)}
function after(t,d){const was=S.cel[S.user+"|"+d];render();
 if(dayFull(d)&&!was){S.cel[S.user+"|"+d]=1;save();celebrate(d)}}
function celebrate(d){const fin=ALL.filter(t=>t.days===d&&!t.optional);const last=d>=TOTAL_DAYS;
 const nm=S.user.split(" ")[0];
 let h=`<div class="modal"><div class="box"><div class="big">${last?"🏆":"🌙"}</div><h3>${last?"Program complete, "+esc(nm)+"!":"Day "+d+" complete, "+esc(nm)+"!"}</h3>`+
 `<p>${last?"Alhamdulillah! You have completed every activity of the entire programme. May Allah accept all your efforts and grant you protection and ease.":MSG[d%MSG.length]}</p>`;
 if(fin.length)h+=`<div class="ach"><b>✅ Activity completed</b><br>${fin.map(t=>esc(t.title.split(" - ")[0])+" ("+t.days+" days)").join("<br>")}</div>`;
 if(!last)h+=`<p>${NEXT[d%NEXT.length]}</p>`;
 h+=`<button class="pri" onclick="closeM()">${last?"Close":"Ready for tomorrow"}</button></div></div>`;modal=h;render()}
function closeM(){modal=null;render()}
function render(){const app=document.getElementById("app");
 if(!S.user){app.innerHTML=`<div class="modal"><div class="box who"><h3>Who is using this app?</h3><p>Your progress is saved separately for each person.</p>${PEOPLE.map((p,i)=>`<button onclick="pick(${i})">${p}</button>`).join("")}</div></div>`;return}
 if(!S.start[S.user]){app.innerHTML=`<div class="modal"><div class="box"><h3>Assalamu alaikum, ${esc(S.user.split(" ")[0])}</h3><p>When does Day 1 begin?</p><input type="date" id="sd" value="${ymd(new Date())}"><button class="pri" onclick="setStart()">Start</button><button class="alt" onclick="S.user=null;save();render()">Back</button></div></div>`;return}
 const today=todayNo(),cap=Math.min(Math.max(today,1),TOTAL_DAYS);
 if(today<1){app.innerHTML=`<div class="modal"><div class="box"><div class="big">⏳</div><h3>Day 1 hasn't started</h3><p>Your programme begins on ${S.start[S.user]}.</p><button class="pri" onclick="menu()">Settings</button></div></div>`;return}
 if(view>cap||view<1)view=cap;
 const tasks=ALL.filter(t=>active(t,view));const req=tasks.filter(t=>!t.optional);
 const dn=req.filter(t=>isDone(t,view)).length,pct=req.length?Math.round(dn/req.length*100):100;
 let h=`<header><div class="top"><div><h1>${esc(S.user)}</h1><div class="sub">Day ${view} of ${TOTAL_DAYS}${view===today?" · Today":today>TOTAL_DAYS&&view===TOTAL_DAYS?"":""}</div></div><button class="iconbtn" onclick="menu()">⚙ Menu</button></div>`+
 `<div class="days">${Array.from({length:cap},(_,i)=>i+1).map(d=>`<button class="d ${d===view?"on":""} ${dayFull(d)?"full":""}" onclick="view=${d};render();scrollTo(0,0)">${d}</button>`).join("")}</div>`+
 `<div class="bar"><i style="width:${pct}%"></i></div><div class="sub" style="margin-top:5px">${dn} of ${req.length} tasks done · ${pct}%</div></header><main>`;
 if(today>TOTAL_DAYS&&view===TOTAL_DAYS)h+=`<div class="banner">🏆 The full programme period has ended. You can still review any day above.</div>`;
 if(dayFull(view))h+=`<div class="banner">✅ All tasks for Day ${view} are complete. MashaAllah!</div>`;
 for(const s of DATA){const ts=s.tasks.filter(t=>active(t,view));if(!ts.length)continue;
  const sd=ts.filter(t=>!t.optional&&isDone(t,view)).length,sr=ts.filter(t=>!t.optional).length;
  h+=`<div class="sec"><h2>${s.name}</h2><span>${sd}/${sr}</span></div>`;
  for(const t of ts)h+=card(t)}
 const fin=ALL.filter(t=>t.days&&t.days<view&&!t.optional);
 if(fin.length){h+=`<div class="sec"><h2>Completed activities</h2><span>${fin.length}</span></div>`;
  for(const t of fin)h+=`<div class="card fin"><div class="ttl"><span class="ok">✔ Completed</span> · ${esc(t.title)}</div><div class="meta">${esc(secName(t))} · ${t.days}-day period finished</div></div>`}
 app.innerHTML=h+"</main>"+(modal||"");const on=app.querySelector(".d.on");if(on)on.scrollIntoView({inline:"center",block:"nearest"})}
const secName=t=>DATA.find(s=>s.tasks.includes(t)).name;
function card(t){const d=view,c=got(d,t.id),dn=c>=t.n,i=ALL.indexOf(t);
 const left=t.days?`<span class="pill ${t.days===d?"last":""}">Day ${d} of ${t.days}${t.days===d?" · last day":""}</span>`:`<span class="pill">Throughout</span>`;
 let h=`<div class="card ${dn?"done":""}"><div class="row">`;
 if(t.optional||t.kind!=="count")h+=`<button class="chk" onclick="tog(${i})">${dn?"✓":""}</button>`;
 h+=`<div style="flex:1"><div class="ttl">${esc(t.title)}</div><div class="meta">${t.optional?"":`<span class="pill">${esc(t.amount)}</span>`}${left}</div></div></div>`;
 if(t.en||t.ta)h+=`<details><summary>Read · English &amp; தமிழ்</summary><div class="txt"><b>English transliteration</b>${esc(t.en)}<b>தமிழ் (Tamil transliteration)</b>${esc(t.ta)}</div></details>`;
 if(!t.optional&&t.kind==="count")h+=`<div class="ctr"><button class="s" onclick="add(${i},-1)">−1</button><span class="n">${c} / ${t.n}</span><button onclick="add(${i},1)">+1</button>${t.n>=50?`<button onclick="add(${i},10)">+10</button><button onclick="add(${i},100)">+100</button>`:""}<button class="s" onclick="add(${i},999)">✓ All</button></div>`;
 return h+"</div>"}
function tog(i){const t=ALL[i];setCount(t,view,got(view,t.id)>=t.n?0:t.n)}
function add(i,n){const t=ALL[i];setCount(t,view,got(view,t.id)+n)}
function pick(i){S.user=PEOPLE[i];save();render()}
function setStart(){S.start[S.user]=document.getElementById("sd").value||ymd(new Date());save();view=todayNo();render()}
function menu(){modal=`<div class="modal"><div class="box"><h3>Menu</h3><p>${esc(S.user)}<br><small>Day 1: ${S.start[S.user]}</small></p>
<button class="alt" onclick="S.user=null;modal=null;save();render()">Switch person</button>
<button class="alt" onclick="delete S.start[S.user];modal=null;save();render()">Change start date</button>
<button class="alt" onclick="if(confirm('Erase all progress for ${esc(S.user)}?')){delete S.prog[S.user];Object.keys(S.cel).forEach(k=>k.startsWith(S.user+'|')&&delete S.cel[k]);save();modal=null;render()}">Reset my progress</button>
<button class="pri" onclick="closeM()">Close</button></div></div>`;render()}
if(S.user&&S.start[S.user])view=Math.min(Math.max(todayNo(),1),TOTAL_DAYS);
render();
</script></body></html>
